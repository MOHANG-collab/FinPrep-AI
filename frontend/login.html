<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — FinPrep AI</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/app.js" defer></script>
</head>
<body data-page="login">
  <main class="authwrap">
    <aside class="auth-intro">
      <a class="brand" href="/">FinPrep <b class="brand-ai">AI</b></a>
      <div class="auth-intro-copy">
        <span class="auth-kicker">Your data workspace</span>
        <h2>Bring clarity to your financial data.</h2>
        <p>Sign in to continue preparing and exploring your datasets.</p>
      </div>
      <a class="auth-back" href="/">← Back to FinPrep AI</a>
    </aside>
    <section class="authcard glass">
      <div class="auth-heading">
        <span class="auth-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3.75v10m-4-4 4 4 4-4M5 15.75v3.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5"/></svg>
        </span>
        <h1>Welcome back</h1>
        <p class="muted">Enter your account details to continue.</p>
      </div>
      <div id="message" hidden></div>
      <form onsubmit="login(event)">
        <div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div>
        <button class="btn">Sign In</button>
      </form>
      <p class="auth-switch">New to FinPrep AI? <a class="accent" href="/register.html">Create an account</a></p>
    </section>
  </main>
</body>
</html>
