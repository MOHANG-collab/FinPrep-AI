<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — FinPrep AI</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/app.js" defer></script>
</head>
<body data-page="register">
  <main class="authwrap">
    <aside class="auth-intro">
      <a class="brand" href="/">FinPrep <b class="brand-ai">AI</b></a>
      <div class="auth-intro-copy">
        <span class="auth-kicker">Start with a clearer picture</span>
        <h2>A focused workspace for your financial data.</h2>
        <p>Create an account to upload, profile, and prepare your datasets.</p>
      </div>
      <a class="auth-back" href="/">← Back to FinPrep AI</a>
    </aside>
    <section class="authcard glass">
      <div class="auth-heading">
        <span class="auth-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.5 20a7.5 7.5 0 0 1 15 0M19 8v6m-3-3h6"/></svg>
        </span>
        <h1>Create your account</h1>
        <p class="muted">A few details and you’re ready to get started.</p>
      </div>
      <div id="message" hidden></div>
      <form onsubmit="register(event)">
        <div class="field"><label for="name">Full Name</label><input id="name" required minlength="2" autocomplete="name"></div>
        <div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div>
        <div class="field"><label for="password">Password (8+ characters)</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div>
        <div class="field"><label for="confirm">Confirm Password</label><input id="confirm" type="password" minlength="8" required autocomplete="new-password"></div>
        <button class="btn">Create Account</button>
      </form>
      <p class="auth-switch">Already registered? <a class="accent" href="/login.html">Sign in</a></p>
    </section>
  </main>
</body>
</html>
