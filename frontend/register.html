<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register — FinPrep AI</title><link rel="stylesheet" href="/assets/css/style.css"><script src="/assets/js/app.js" defer></script></head><body data-page="register"><div class="authwrap"><div class="authcard glass"><a class="brand" href="/" style="justify-content:center;margin-bottom:12px">FinPrep <b class="brand-ai">AI</b></a><h1>Create your account</h1><p class="muted">Financial data clarity starts here.</p><div id="message" hidden></div><form onsubmit="register(event)"><div class="field"><label>Full Name</label><input id="name" required minlength="2" autocomplete="name"></div><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password (8+ characters)</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label>Confirm Password</label><input id="confirm" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn">Create Account</button></form><p class="muted">Already registered? <a class="accent" href="/login.html">Sign in</a></p></div></div></body></html>
